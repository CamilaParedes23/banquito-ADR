site_name: Banco BanQuito — Arquitectura
site_description: ADR, ASR, estándares y evidencia de la evolución arquitectónica de Banco BanQuito

theme:
  name: material
  language: es
  palette:
    - scheme: default
  features:
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.suggest

nav:
  - Inicio: index.md
  - Decisiones arquitectónicas:
      - Decision Log: adr/index.md
      - Monolito: adr/monolito/index.md
      - Microservicios: adr/microservicios/index.md
      - Microservicios-cloud: adr/microservicios-cloud/index.md
      - Plantilla ADR: adr/ADR-0000-template.md
  - ASR: asr/index.md
  - Gobierno:
      - ADR vs requisito: governance/criterios-adr-vs-requisito.md
      - Ciclo de vida: governance/adr-lifecycle.md
      - Matriz de depuración: governance/matriz-depuracion.md
  - Estándares:
      - Índice: standards/index.md
      - Configuración: standards/configuration/perfiles-y-variables-entorno.md
      - API Keys: standards/security/api-keys-en-gateway.md
      - Cobertura: standards/testing/cobertura-minima.md
      - Actuator y Micrometer: standards/observability/actuator-micrometer.md
      - Correlation ID: standards/observability/correlation-id.md
      - Idempotencia interbancaria: standards/integration/idempotencia-interbancaria.md
  - Funcional:
      - Frontend interbancario: functional/interbancario-frontend.md
  - Evidencia:
      - Inventario de fuentes: evidence/source-inventory.md

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
